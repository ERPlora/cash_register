[package]
name = "cash-register-handler"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[features]
guest = ["dep:extism-pdk"]
[dependencies]
erplora-guest-sdk = { path = "../../../crates/guest-sdk" }
extism-pdk = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
opt-level = "s"
[workspace]
